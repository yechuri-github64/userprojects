plugins {
    id "io.micronaut.application" version "4.6.1"
    id "com.gradleup.shadow" version "8.3.9"  //updated
    id "java"
}

group = "com.ai2dev"
version = "0.1"

repositories {
    mavenCentral()
}

micronaut {
    version "4.6.1" //updated
    runtime("lambda_java") //updated
    testRuntime "junit5"
    processing {
        incremental true
        annotations "com.ai2dev.randomlambda1.*"
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation platform("io.micronaut.platform:micronaut-platform:4.6.1") //added
    implementation platform("io.micronaut.aws:micronaut-aws-bom:4.6.1") // ADD THIS
    annotationProcessor "io.micronaut:micronaut-http-validation"
    implementation "io.micronaut:micronaut-runtime"
    implementation "io.micronaut.aws:micronaut-function-aws" // now version comes from AWS BOM
    implementation "io.micronaut:micronaut-jackson-databind"
    implementation "com.fasterxml.jackson.core:jackson-databind"
    implementation "jakarta.annotation:jakarta.annotation-api"
    implementation "jakarta.inject:jakarta.inject-api"
    testImplementation "org.junit.jupiter:junit-jupiter-api"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    testImplementation "io.micronaut.test:micronaut-test-junit5"
}

application {
    mainClass.set("com.ai2dev.randomlambda1.Application")
}

tasks.withType(Test) {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName.set("function")
    mergeServiceFiles()
}
