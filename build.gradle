plugins {
    id "io.micronaut.application" version "4.6.1"
    id "com.gradleup.shadow" version "8.3.9"
}

group = "com.ai2dev"
version = "0.1"

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

micronaut {
    version = "4.6.1"
    runtime("lambda_java")
}

dependencies {
    // Ensure BOM versions are enforced globally
    implementation(enforcedPlatform("io.micronaut.platform:micronaut-platform:4.6.1"))
    implementation(enforcedPlatform("io.micronaut.aws:micronaut-aws-bom:4.6.1"))

    // AWS Lambda & function API
    implementation("io.micronaut.aws:micronaut-aws-lambda")
    implementation("io.micronaut.aws:micronaut-function-aws-api-proxy")

    // Core Micronaut dependencies
    implementation("io.micronaut:micronaut-runtime")
    implementation("io.micronaut:micronaut-http-client")

    // Logging
    runtimeOnly("ch.qos.logback:logback-classic")

    // Annotation processor
    annotationProcessor("io.micronaut:micronaut-inject-java")
}

application {
    mainClass = "com.ai2dev.randomnumber.Application"
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

shadowJar {
    archiveBaseName.set("lambda")
    archiveClassifier.set("")
    archiveVersion.set("0.1")
    mergeServiceFiles()
}
