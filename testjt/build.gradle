plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1' // ✅ newer, supports Gradle 8+
    id 'io.micronaut.application' version '4.3.4'        // ✅ use plugin compatible with Micronaut 4.4.x
}

group = 'testjt'
version = '0.1'

repositories {
    mavenCentral()
}

micronaut {
    version '4.4.0'          // ✅ REQUIRED (fixes "Micronaut version not set" error)
    runtime 'lambda_java'     // ✅ valid runtime for AWS Lambda (LAMBDA is invalid)
    testRuntime 'junit5'
    processing {
        incremental true
        annotations 'Testjt.*'
    }
}

dependencies {
    // === Core Micronaut ===
    implementation 'io.micronaut:micronaut-runtime:4.4.0'

    // === AWS Lambda Support ===
    implementation 'io.micronaut.aws:micronaut-function-aws:4.11.0'

    // === HTTP Client ===
    implementation 'io.micronaut:micronaut-http-client:4.4.0'

    // === JDBC / SQL Support ===
    implementation 'io.micronaut.sql:micronaut-jdbc-hikari:4.4.0'
    implementation 'mysql:mysql-connector-java:8.0.33'

    // === Logging ===
    implementation 'ch.qos.logback:logback-classic:1.4.11'
    implementation 'org.slf4j:slf4j-api:2.0.7'

    // === Annotation Processing ===
    annotationProcessor 'io.micronaut:micronaut-inject-java:4.4.0'

    // === Testing ===
    testImplementation 'io.micronaut.test:micronaut-test-junit5:4.4.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
}

application {
    mainClass = 'Testjt.Application'
}

java {
    toolchain {
        // ✅ Micronaut baseline is Java 17, but you can use 21 safely
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(Test) {
    useJUnitPlatform()
}
